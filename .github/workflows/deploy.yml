name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject PAT into app.js
        env:
          SST_ADO_PAT: ${{ secrets.SST_ADO_PAT }}
        run: |
          sed -i "s|%%SST_ADO_PAT%%|${SST_ADO_PAT}|g" app.js
          
      - name: Verify injection
        run: grep -c "%%SST_ADO_PAT%%" app.js && echo "PLACEHOLDER STILL PRESENT" || echo "Injection OK"
        
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Export deployment log to Snowflake
        if: always()   # run even on failure so you capture failed deploys
        env:
          SNOWFLAKE_PAT: ${{ secrets.SNOWFLAKE_PAT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/export_log_to_snowflake.py \
            --run-id ${{ github.run_id }} \
            --workflow "${{ github.workflow }}" \
            --branch "${{ github.ref_name }}" \
            --actor "${{ github.actor }}" \
            --status "${{ job.status }}"
