name: Create STICRs

on:
  workflow_dispatch:
    inputs:
      payload_b64:
        description: 'Base64-encoded STICR payload (triggered automatically by the SST tool)'
        required: true

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install requests

      - name: Create STICRs in Azure DevOps
        env:
          SST_ADO_PAT: ${{ secrets.SST_ADO_PAT }}
          PAYLOAD_B64: ${{ inputs.payload_b64 }}
        run: python scripts/create_sticrs.py
