name: Pull Microsoft Updates

on:
  workflow_dispatch:
    inputs:
      month:
        description: 'Month number (1-12)'
        required: true
      year:
        description: 'Year (e.g. 2026)'
        required: true

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pandas lxml

      - name: Pull Microsoft catalog updates
        run: python scripts/pull_ms_updates.py --year ${{ inputs.year }} --month ${{ inputs.month }}

      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ms_updates/
          git diff --cached --quiet || git commit -m "chore: MS updates ${{ inputs.year }}-${{ inputs.month }}"
          git push
